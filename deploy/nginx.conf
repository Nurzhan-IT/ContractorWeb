# Nginx configuration for contractorwebdev.com
# Place at: /etc/nginx/sites-available/contractorwebdev
# Enable: ln -s /etc/nginx/sites-available/contractorwebdev /etc/nginx/sites-enabled/

# Redirect HTTP → HTTPS (Cloudflare handles public HTTPS, but good practice)
server {
    listen 80;
    listen [::]:80;
    server_name contractorwebdev.com www.contractorwebdev.com;

    # Allow Cloudflare health checks
    location /health/ {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name contractorwebdev.com www.contractorwebdev.com;

    # ----------------------------------------------------------------
    # SSL — Cloudflare Origin Certificate
    # Generate at: Cloudflare → SSL/TLS → Origin Server → Create Certificate
    # ----------------------------------------------------------------
    ssl_certificate     /etc/ssl/cloudflare/contractorwebdev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/contractorwebdev.key;

    # Modern SSL config (TLS 1.2/1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ----------------------------------------------------------------
    # Cloudflare real IP passthrough
    # ----------------------------------------------------------------
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ----------------------------------------------------------------
    # Logging
    # ----------------------------------------------------------------
    access_log /var/log/nginx/contractorwebdev_access.log;
    error_log  /var/log/nginx/contractorwebdev_error.log;

    # ----------------------------------------------------------------
    # Static files — served directly by nginx (fast)
    # ----------------------------------------------------------------
    location /static/ {
        alias /var/www/contractorwebdev/website_django/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----------------------------------------------------------------
    # Media files — user-uploaded portfolio images
    # ----------------------------------------------------------------
    location /media/ {
        alias /var/www/contractorwebdev/website_django/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ----------------------------------------------------------------
    # Favicon (often requested separately)
    # ----------------------------------------------------------------
    location = /favicon.ico {
        alias /var/www/contractorwebdev/website_django/staticfiles/img/favicons/favicon.svg;
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------------------------
    # Django app — proxy to gunicorn via Unix socket
    # ----------------------------------------------------------------
    location / {
        proxy_pass http://unix:/run/contractorwebdev/gunicorn.sock;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;   # matches gunicorn timeout
        proxy_send_timeout    60s;

        # Buffer settings
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;

        # Max upload size (portfolio images + quote photos)
        client_max_body_size 20M;
    }

    # ----------------------------------------------------------------
    # Security headers (complement Django's own headers)
    # ----------------------------------------------------------------
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
