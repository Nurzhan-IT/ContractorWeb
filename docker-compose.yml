services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contractordev}
      POSTGRES_USER: ${POSTGRES_USER:-contractordev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contractordev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contractordev} -d ${POSTGRES_DB:-contractordev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Passed to the image's ENTRYPOINT (docker/entrypoint.sh) as "$@": it
    # waits for `db`, runs migrations, then execs this in place of the
    # image's default gunicorn CMD.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file:
      - .env
    environment:
      # Override whatever local dev values are in .env: this container
      # talks to the `db` service, not SQLite, and uses dev-friendly settings.
      DJANGO_SETTINGS_MODULE: config.settings.docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-contractordev}:${POSTGRES_PASSWORD:-contractordev}@db:5432/${POSTGRES_DB:-contractordev}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
